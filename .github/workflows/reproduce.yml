name: Check paper data and figures
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_bundle.py --report outputs/validation.json
      - run: python scripts/reproduce_figures.py
