name: Reproduce paper figures
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify data checksums are up to date
        run: python scripts/update_checksums.py --check
      - name: Validate data bundle
        run: python scripts/validate_bundle.py --report outputs/validation.json
      - name: Regenerate Figures 6-10
        run: python scripts/reproduce_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: |
            outputs/figures/
            outputs/validation.json
